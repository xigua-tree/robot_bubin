; PlatformIO Project Configuration File
; 芯片：STM32F407VET6 (Cortex-M4F，512KB Flash，192KB RAM)
; 调试器：ST-Link
; 项目结构：STM32CubeMX 生成 → Core/、Drivers/

[platformio]
; 源代码编译目录移到项目根目录（因为 Core/Src 不在默认 src/ 下）
src_dir = ./

[env:genericSTM32F407VET6]
; 平台和板子
platform = ststm32
board = genericSTM32F407VET6
; 不使用 stm32cube 框架，而是用项目自带的 HAL 驱动和 CMSIS
; framework = stm32cube

; 编译选项
build_flags =
  ; 芯片宏定义：F407VET6
  -D STM32F407xx
  ; 启用 HAL 驱动
  -D USE_HAL_DRIVER
  ; Cortex-M4F FPU 选项（ARM_CM4F FreeRTOS port 依赖硬件 FPU 指令）
  -mfloat-abi=softfp
  -mfpu=fpv4-sp-d16
  ; 用户头文件
  -I Core/Inc
  ; CMSIS 核心头文件
  -I Drivers/CMSIS/Include
  ; CMSIS 设备相关头文件（STM32F4xx 系列）
  -I Drivers/CMSIS/Device/ST/STM32F4xx/Include
  ; HAL 驱动头文件
  -I Drivers/STM32F4xx_HAL_Driver/Inc
  ; HAL 驱动 Legacy 头文件
  -I Drivers/STM32F4xx_HAL_Driver/Inc/Legacy
  ; FreeRTOS 头文件
  -I Middlewares/Third_Party/FreeRTOS/Source/include
  ; FreeRTOS ARM Cortex-M4F 移植层（带 FPU）
  -I Middlewares/Third_Party/FreeRTOS/Source/portable/GCC/ARM_CM4F
  ; FreeRTOS CMSIS-RTOS V2 封装
  -I Middlewares/Third_Party/FreeRTOS/Source/CMSIS_RTOS_V2


; 源文件过滤器
; +<路径/>  → 包含该路径下所有文件
; +<文件>  → 包含特定文件
; -<路径/>  → 排除该路径
build_src_filter = +<Core/Src/> +<startup_stm32f407xx.s> +<Drivers/STM32F4xx_HAL_Driver/Src/> +<Middlewares/Third_Party/FreeRTOS/Source/*.c> +<Middlewares/Third_Party/FreeRTOS/Source/portable/GCC/ARM_CM4F/port.c> +<Middlewares/Third_Party/FreeRTOS/Source/portable/MemMang/heap_4.c> +<Middlewares/Third_Party/FreeRTOS/Source/CMSIS_RTOS_V2/cmsis_os2.c> -<Drivers/STM32F4xx_HAL_Driver/Src/stm32f4xx_hal_msp_template.c> -<Drivers/STM32F4xx_HAL_Driver/Src/stm32f4xx_hal_timebase_rtc_alarm_template.c> -<Drivers/STM32F4xx_HAL_Driver/Src/stm32f4xx_hal_timebase_rtc_wakeup_template.c> -<Drivers/STM32F4xx_HAL_Driver/Src/stm32f4xx_hal_timebase_tim_template.c> -<.git/> -<.svn/>

; 链接脚本（项目根目录下的 STM32CubeMX 生成脚本）
board_build.ldscript = ./STM32F407XX_FLASH.ld

; 下载协议：ST-Link
upload_protocol = stlink
; 调试工具：ST-Link
debug_tool = stlink
